<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Name · Front-End Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

<!-- React + Babel (needs internet the first time; works great with VS Code "Live Server") -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<style>
  :root {
    --bg: #eef0ff;
    --surface: #ffffff;
    --ink: #14123a;
    --muted: #55538a;
    --line: #cfd2f5;
    --accent: #3b33ff;
    --accent-ink: #ffffff;
    --mark: #ffd84d;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "DM Sans", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #12102b;
    --surface: #1b1940;
    --ink: #ecebff;
    --muted: #a3a1d6;
    --line: #2f2c68;
    --accent: #8f8aff;
    --accent-ink: #12102b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 1.05rem; line-height: 1.65;
    transition: background .3s, color .3s;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: min(1080px, 100% - 2.5rem); margin-inline: auto; }
  section { padding: 6rem 0; }
  h2 {
    font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 2.5rem;
  }
  h2 .mark { background: linear-gradient(transparent 60%, var(--mark) 60%); padding: 0 .1em; color: var(--ink) }
  :root[data-theme="dark"] h2 .mark { background: linear-gradient(transparent 62%, #6a5b12 62%); }

  /* NAV */
  header.nav {
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-family: var(--display); font-weight: 800; font-size: 1.25rem; text-decoration: none; }
  .nav ul { display: flex; gap: 1.6rem; list-style: none; align-items: center; }
  .nav a.link { text-decoration: none; font-weight: 500; color: var(--muted); transition: color .2s; }
  .nav a.link:hover, .nav a.link.on { color: var(--ink); }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.1rem;
  }
  @media (max-width: 700px) { .nav li.hide-sm { display: none; } }

  /* HERO */
  .hero { padding: 5rem 0 6rem; min-height: 82vh; display: flex; align-items: center; }
  .status {
    display: inline-flex; align-items: center; gap: .6rem; padding: .35rem .9rem;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    font-size: .92rem; color: var(--muted); margin-bottom: 2rem;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 #22c55e88; animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px #22c55e00; } 100% { box-shadow: 0 0 0 0 #22c55e00; } }
  .name {
    font-family: var(--display); font-size: clamp(3.6rem, 13vw, 10rem);
    line-height: .92; letter-spacing: -0.04em; user-select: none; margin-bottom: 1.8rem;
  }
  .name .row { display: block; white-space: nowrap; }
  .name span.ch {
    display: inline-block; font-variation-settings: "wght" var(--w, 300), "opsz" 96;
    transition: font-variation-settings .12s ease-out;
  }
  .role { font-size: clamp(1.2rem, 2.6vw, 1.7rem); color: var(--muted); max-width: 36ch; }
  .role b { color: var(--accent); font-weight: 700; }
  .caret { display: inline-block; width: 3px; height: 1.1em; background: var(--accent); vertical-align: -.2em; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .cta { display: flex; gap: 1rem; margin-top: 2.4rem; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: .85rem 1.6rem; border-radius: 10px; font-weight: 700; text-decoration: none;
    border: 2px solid var(--accent); cursor: pointer; font: inherit; font-weight: 700;
    transition: transform .15s, background .2s, color .2s;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:hover { transform: translateY(-2px); }

  /* ABOUT */
  .about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 3.5rem; align-items: start; }
  .about p + p { margin-top: 1.1rem; }
  .facts { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.6rem 1.8rem; }
  .facts dl { display: grid; grid-template-columns: auto 1fr; gap: .7rem 1.2rem; }
  .facts dt { color: var(--muted); }
  .facts dd { font-weight: 500; text-align: right; }
  @media (max-width: 800px) { .about { grid-template-columns: 1fr; } }

  /* SKILLS */
  .tabs { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
  .tab {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: .5rem 1.2rem; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 500;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .bars { display: grid; gap: 1.1rem; max-width: 640px; }
  .bar-top { display: flex; justify-content: space-between; margin-bottom: .3rem; font-weight: 500; }
  .track { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: var(--accent); width: 0; animation: grow .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { width: var(--to); } }

  /* PROJECTS */
  .proj { border-top: 1px solid var(--line); }
  .proj:last-child { border-bottom: 1px solid var(--line); }
  .proj-head {
    width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 1.5rem; align-items: baseline;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 1.6rem .2rem;
  }
  .proj-title { font-family: var(--display); font-size: clamp(1.4rem, 3.4vw, 2.2rem); font-weight: 600; letter-spacing: -.01em; transition: color .2s; }
  .proj-head:hover .proj-title { color: var(--accent); }
  .proj-year { color: var(--muted); }
  .plus { font-size: 1.6rem; transition: transform .25s; line-height: 1; }
  .proj.open .plus { transform: rotate(45deg); }
  .proj-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .proj.open .proj-body { grid-template-rows: 1fr; }
  .proj-inner { overflow: hidden; }
  .proj-inner > div { padding: 0 .2rem 1.8rem; max-width: 62ch; }
  .tags { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  .tag { font-size: .85rem; padding: .15rem .7rem; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .proj-links a { margin-right: 1.4rem; font-weight: 700; color: var(--accent); }

  /* EXPERIENCE */
  .timeline { list-style: none; border-left: 2px solid var(--line); margin-left: .5rem; }
  .timeline li { position: relative; padding: 0 0 2.4rem 2rem; }
  .timeline li::before {
    content: ""; position: absolute; left: -8px; top: .55rem; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--accent);
  }
  .timeline h3 { font-family: var(--display); font-size: 1.4rem; }
  .timeline .when { color: var(--muted); font-size: .95rem; margin-bottom: .4rem; }

  /* CONTACT */
  .contact { display: grid; grid-template-columns: 1fr 1.2fr; gap: 3.5rem; }
  .contact-info a { display: block; margin-top: .6rem; font-weight: 500; }
  form { display: grid; gap: 1.1rem; }
  label { display: grid; gap: .35rem; font-weight: 500; }
  input, textarea {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: .8rem 1rem; width: 100%;
  }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: #e5484d; }
  .err { color: #e5484d; font-size: .9rem; font-weight: 400; }
  .ok { padding: 1rem 1.2rem; border-radius: 10px; background: var(--surface); border: 1px solid #22c55e; }
  @media (max-width: 800px) { .contact { grid-template-columns: 1fr; } }

  footer { border-top: 1px solid var(--line); padding: 2rem 0; color: var(--muted); font-size: .95rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============ EDIT YOUR DETAILS HERE ============ */
const ME = {
  first: "Your",
  last: "Name",
  roles: ["front-end developer", "React specialist", "UI craftsperson", "problem solver"],
  location: "Chennai, India",
  email: "you@example.com",
  github: "https://github.com/yourname",
  linkedin: "https://linkedin.com/in/yourname",
  about: [
    "I build fast, accessible websites and web apps that feel good to use. I care about the details: spacing, motion that means something, and code the next developer can read.",
    "I work mostly with React, modern CSS and JavaScript. When I'm not coding, I'm learning something new, sketching interface ideas, or reading about design.",
  ],
  facts: [["Based in", "Chennai, India"], ["Experience", "3 years"], ["Focus", "React & UI"], ["Available", "Freelance & full-time"]],
  skills: {
    Frontend: [["HTML & CSS", 95], ["JavaScript", 90], ["React", 88], ["Responsive design", 92]],
    Tools: [["Git & GitHub", 85], ["VS Code", 95], ["Vite / npm", 80], ["Figma", 70]],
    Practices: [["Accessibility", 82], ["Performance", 78], ["Testing", 65], ["Code review", 80]],
  },
  projects: [
    { title: "Shopfront", year: 2025, stack: ["React", "CSS", "REST API"], desc: "An e-commerce storefront with search, filters and a cart that survives page reloads. Loads in under a second on a mid-range phone.", live: "#", code: "#" },
    { title: "Taskflow", year: 2024, stack: ["React", "JavaScript", "localStorage"], desc: "A drag-and-drop task board for small teams, with keyboard shortcuts and a dark mode.", live: "#", code: "#" },
    { title: "Weatherly", year: 2024, stack: ["JavaScript", "HTML", "CSS"], desc: "A clean weather dashboard that shows a seven-day forecast and remembers your favourite cities.", live: "#", code: "#" },
  ],
  jobs: [
    { role: "Front-End Developer", org: "Company Name", when: "2024 – Present", text: "Build and maintain React interfaces used by thousands of customers. Cut page load time by 40%." },
    { role: "Junior Web Developer", org: "Another Company", when: "2022 – 2024", text: "Turned designs into responsive pages and helped move a legacy site to React." },
    { role: "B.E. Computer Science", org: "Your University", when: "2018 – 2022", text: "Graduated with a focus on web technologies and human-computer interaction." },
  ],
};
/* ================================================= */

/* ---------- Hero name: letters get bolder near your cursor ---------- */
function Name() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const chars = () => [...el.querySelectorAll(".ch")];
    const move = (e) => {
      chars().forEach((c) => {
        const r = c.getBoundingClientRect();
        const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
        c.style.setProperty("--w", Math.round(300 + 500 * Math.max(0, 1 - d / 180)));
      });
    };
    const leave = () => chars().forEach((c) => c.style.setProperty("--w", 300));
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerleave", leave);
    return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerleave", leave); };
  }, []);
  const row = (t) => <span className="row">{[...t].map((ch, i) => <span className="ch" key={i}>{ch}</span>)}</span>;
  return <h1 className="name" ref={ref} aria-label={`${ME.first} ${ME.last}`}><span aria-hidden="true">{row(ME.first)}{row(ME.last)}</span></h1>;
}

/* ---------- Typing effect ---------- */
function Typer({ words }) {
  const [i, setI] = useState(0), [txt, setTxt] = useState(""), [del, setDel] = useState(false);
  useEffect(() => {
    const w = words[i % words.length];
    const t = setTimeout(() => {
      if (!del && txt === w) return setDel(true);
      if (del && txt === "") { setDel(false); return setI(i + 1); }
      setTxt(del ? w.slice(0, txt.length - 1) : w.slice(0, txt.length + 1));
    }, !del && txt === w ? 1400 : del ? 40 : 80);
    return () => clearTimeout(t);
  }, [txt, del, i]);
  return <b>{txt}<span className="caret" aria-hidden="true" /></b>;
}

function Nav({ theme, setTheme }) {
  const [active, setActive] = useState("");
  const ids = ["about", "skills", "work", "journey", "contact"];
  useEffect(() => {
    const io = new IntersectionObserver(
      (es) => es.forEach((e) => e.isIntersecting && setActive(e.target.id)),
      { rootMargin: "-45% 0px -50% 0px" }
    );
    ids.forEach((id) => { const n = document.getElementById(id); n && io.observe(n); });
    return () => io.disconnect();
  }, []);
  const labels = { about: "About", skills: "Skills", work: "Projects", journey: "Journey", contact: "Contact" };
  return (
    <header className="nav">
      <div className="wrap">
        <a href="#top" className="logo">{ME.first[0]}{ME.last[0]}.</a>
        <ul>
          {ids.map((id) => (
            <li key={id} className={id === "journey" || id === "skills" ? "hide-sm" : ""}>
              <a className={"link" + (active === id ? " on" : "")} href={"#" + id}>{labels[id]}</a>
            </li>
          ))}
          <li>
            <button className="theme-btn" onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
              aria-label={`Switch to ${theme === "dark" ? "light" : "dark"} theme`}>
              {theme === "dark" ? "☀" : "☾"}
            </button>
          </li>
        </ul>
      </div>
    </header>
  );
}

function Hero() {
  return (
    <section className="hero" id="top">
      <div className="wrap">
        <p className="status"><span className="dot" /> Open to new projects</p>
        <Name />
        <p className="role">I'm a <Typer words={ME.roles} /> who builds clear, fast and friendly websites.</p>
        <div className="cta">
          <a className="btn primary" href="#work">See my work</a>
          <a className="btn ghost" href="#contact">Get in touch</a>
        </div>
      </div>
    </section>
  );
}

function About() {
  return (
    <section id="about">
      <div className="wrap">
        <h2>About <span className="mark">me</span></h2>
        <div className="about">
          <div>{ME.about.map((p, i) => <p key={i}>{p}</p>)}</div>
          <div className="facts"><dl>{ME.facts.map(([k, v]) => <React.Fragment key={k}><dt>{k}</dt><dd>{v}</dd></React.Fragment>)}</dl></div>
        </div>
      </div>
    </section>
  );
}

function Skills() {
  const groups = Object.keys(ME.skills);
  const [tab, setTab] = useState(groups[0]);
  return (
    <section id="skills">
      <div className="wrap">
        <h2>What I <span className="mark">work with</span></h2>
        <div className="tabs" role="tablist">
          {groups.map((g) => <button key={g} role="tab" className="tab" aria-selected={tab === g} onClick={() => setTab(g)}>{g}</button>)}
        </div>
        <div className="bars" key={tab}>
          {ME.skills[tab].map(([n, v]) => (
            <div key={n}>
              <div className="bar-top"><span>{n}</span><span>{v}%</span></div>
              <div className="track" role="progressbar" aria-valuenow={v} aria-valuemin="0" aria-valuemax="100" aria-label={n}>
                <div className="fill" style={{ "--to": v + "%" }} />
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Projects() {
  const [open, setOpen] = useState(0);
  return (
    <section id="work">
      <div className="wrap">
        <h2>Selected <span className="mark">projects</span></h2>
        {ME.projects.map((p, i) => (
          <div key={p.title} className={"proj" + (open === i ? " open" : "")}>
            <button className="proj-head" aria-expanded={open === i} onClick={() => setOpen(open === i ? -1 : i)}>
              <span className="proj-title">{p.title}</span>
              <span className="proj-year">{p.year}</span>
              <span className="plus" aria-hidden="true">+</span>
            </button>
            <div className="proj-body">
              <div className="proj-inner">
                <div>
                  <p>{p.desc}</p>
                  <div className="tags">{p.stack.map((s) => <span className="tag" key={s}>{s}</span>)}</div>
                  <div className="proj-links"><a href={p.live}>Live demo</a><a href={p.code}>Source code</a></div>
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

function Journey() {
  return (
    <section id="journey">
      <div className="wrap">
        <h2>My <span className="mark">journey</span></h2>
        <ol className="timeline">
          {ME.jobs.map((j) => (
            <li key={j.role}>
              <h3>{j.role}, {j.org}</h3>
              <p className="when">{j.when}</p>
              <p>{j.text}</p>
            </li>
          ))}
        </ol>
      </div>
    </section>
  );
}

function Contact() {
  const [f, setF] = useState({ name: "", email: "", message: "" });
  const [errs, setErrs] = useState({});
  const [sent, setSent] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!f.name.trim()) er.name = "Enter your name.";
    if (!/^\S+@\S+\.\S+$/.test(f.email)) er.email = "Enter a valid email address, like name@example.com.";
    if (f.message.trim().length < 10) er.message = "Write at least 10 characters.";
    setErrs(er);
    if (Object.keys(er).length) return;
    const body = encodeURIComponent(`${f.message}\n\n— ${f.name} (${f.email})`);
    window.location.href = `mailto:${ME.email}?subject=${encodeURIComponent("Hello from your website")}&body=${body}`;
    setSent(true);
  };
  return (
    <section id="contact">
      <div className="wrap contact">
        <div className="contact-info">
          <h2>Let's <span className="mark">talk</span></h2>
          <p>Have a project, a role or just a question? Send a message and I'll reply within two days.</p>
          <a href={"mailto:" + ME.email}>{ME.email}</a>
          <a href={ME.github}>GitHub</a>
          <a href={ME.linkedin}>LinkedIn</a>
        </div>
        <form onSubmit={submit} noValidate>
          {["name", "email", "message"].map((k) => (
            <label key={k}>
              {k[0].toUpperCase() + k.slice(1)}
              {k === "message"
                ? <textarea rows="5" value={f[k]} onChange={set(k)} aria-invalid={!!errs[k]} />
                : <input type={k === "email" ? "email" : "text"} value={f[k]} onChange={set(k)} aria-invalid={!!errs[k]} />}
              {errs[k] && <span className="err">{errs[k]}</span>}
            </label>
          ))}
          <button className="btn primary" type="submit">Send message</button>
          {sent && <p className="ok" role="status">Your email app should open with the message ready to send.</p>}
        </form>
      </div>
    </section>
  );
}

function App() {
  const [theme, setTheme] = useState(
    () => localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
  );
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("theme", theme);
  }, [theme]);
  return (
    <>
      <Nav theme={theme} setTheme={setTheme} />
      <main>
        <Hero /><About /><Skills /><Projects /><Journey /><Contact />
      </main>
      <footer>
        <div className="wrap">
          <span>© {new Date().getFullYear()} {ME.first} {ME.last}</span>
          <span>Built with React</span>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
